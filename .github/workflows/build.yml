name: Compilar APK do Olho de Deus
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar projeto
        run: |
          unzip -q OlhoDeDeus.zip -d .
          cd OlhoDeDeus
          echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OlhoDeDeus-APK
          path: OlhoDeDeus/app/build/outputs/apk/debug/*.apk
